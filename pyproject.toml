[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitfeat"
version = "0.1.0"
description = "BitFeat: 1.58-bit local features with BitNet ternary weights"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex Schultz" }]
keywords = ["local-features", "bitnet", "ternary", "keypoints", "descriptors"]
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bitfeat-train = "bitfeat.train:main"
bitfeat-extract = "bitfeat.extract:main"

[tool.setuptools.packages.find]
include = ["bitfeat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
